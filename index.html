<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Black Angus | Hamburgueria</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <header>
    <div class="header-content">
        <img src="assets/imagens/logo-black-angus.jpg" alt="Logo Black Angus" class="logo">
        <div>
            <h1>Black Angus</h1>
            <p>Hamburgueria</p>
        </div>
    </div>
</header>
<!-- BOTÃO DO CARRINHO -->

<div class="container text-end mt-3">

    <button
        class="btn btn-dark position-relative"
        data-bs-toggle="offcanvas"
        data-bs-target="#carrinho"
    >

        🛒 Carrinho

        <span
            id="contador-carrinho"
            class="badge bg-danger"
        >
            0
        </span>

    </button>

</div>


<!-- CARRINHO -->

<div
    class="offcanvas offcanvas-end"
    tabindex="-1"
    id="carrinho"
>

    <div class="offcanvas-header">

        <h5 class="offcanvas-title">
            Seu pedido
        </h5>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
        ></button>

    </div>


    <div class="offcanvas-body">

        <div id="itens-carrinho"></div>


        <hr>


        <div class="d-flex justify-content-between">

            <strong>Subtotal:</strong>

            <strong id="subtotal">
                R$ 0,00
            </strong>

        </div>


        <div class="d-flex justify-content-between">

            <span>Entrega:</span>

            <span id="taxa-entrega">
                R$ 5,00
            </span>

        </div>


        <hr>


        <div class="d-flex justify-content-between fs-5">

            <strong>Total:</strong>

            <strong id="total">
                R$ 5,00
            </strong>

        </div>


        <button
            class="btn btn-success w-100 mt-4"
            onclick="abrirCheckout()"
        >
            Finalizar pedido
        </button>

    </div>

</div>
    <main>

        <section class="banner">
            <h2>Os melhores hambúrgueres da cidade</h2>
            <p>Escolha seu favorito e monte seu pedido.</p>
        </section>

                <section class="categorias">

            <button id="btn-promocao" class="active" onclick="filtrarCategoria('promocao')">🔥 Promoção da Semana</button>
            <button id="btn-hamburgueres" onclick="filtrarCategoria('hamburgueres')">🍔 Burguers Clássicos</button>
            <button id="btn-entradinhas" onclick="filtrarCategoria('entradinhas')">🍤 Entradinhas</button>
            <button id="btn-combos" onclick="filtrarCategoria('combos')">🧾 Combos</button>
            <button id="btn-hotdogs" onclick="filtrarCategoria('hotdogs')">🌭 Hot-Dogs</button>
            <button id="btn-kids" onclick="filtrarCategoria('kids')">🧒 Black Kids</button>
            <button id="btn-sobremesas" onclick="filtrarCategoria('sobremesas')">🍨 Sobremesas</button>
            <button id="btn-bebidas" onclick="filtrarCategoria('bebidas')">🥤 Bebidas</button>
            <button id="btn-adicionais" onclick="filtrarCategoria('adicionais')">➕ Adicionais</button>

        </section>
        <section class="produtos container">

            <h2 class="mb-4" id="titulo-secao">Promoção da Semana</h2>

        <div id="lista-produtos" class="row g-4"></div>

            </section>
    </main>

    <script src="script.js"></script>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<!-- CHECKOUT -->

<div
    class="modal fade"
    id="modalCheckout"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    Finalizar pedido
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <h5 class="mb-3">
                    📍 Endereço de entrega
                </h5>


                <div class="mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome-cliente"
                        class="form-control"
                        placeholder="Seu nome"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone-cliente"
                        class="form-control"
                        placeholder="(61) 99999-9999"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Endereço
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        class="form-control"
                        placeholder="Rua, avenida..."
                    >

                </div>


                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Número
                        </label>

                        <input
                            type="text"
                            id="numero"
                            class="form-control"
                            placeholder="123"
                        >

                    </div>


                    <div class="col-md-8 mb-3">

                        <label class="form-label">
                            Complemento
                        </label>

                        <input
                            type="text"
                            id="complemento"
                            class="form-control"
                            placeholder="Apartamento, casa..."
                        >

                    </div>

                </div>


                <button
                    type="button"
                    class="btn btn-outline-primary mb-4"
                    onclick="usarLocalizacao()"
                >
                    📍 Usar minha localização
                </button>


                <hr>


                <h5 class="mb-3">
                    💳 Forma de pagamento
                </h5>


                <div class="row">

                    <div class="col-md-4">

                        <input
                            type="radio"
                            class="btn-check"
                            name="pagamento"
                            id="credito"
                            value="Crédito"
                        >

                        <label
                            class="btn btn-outline-dark w-100"
                            for="credito"
                        >
                            💳 Crédito
                        </label>

                    </div>


                    <div class="col-md-4">

                        <input
                            type="radio"
                            class="btn-check"
                            name="pagamento"
                            id="debito"
                            value="Débito"
                        >

                        <label
                            class="btn btn-outline-dark w-100"
                            for="debito"
                        >
                            💳 Débito
                        </label>

                    </div>


                    <div class="col-md-4">

                        <input
                            type="radio"
                            class="btn-check"
                            name="pagamento"
                            id="pix"
                            value="PIX"
                        >

                        <label
                            class="btn btn-outline-success w-100"
                            for="pix"
                        >
                            🟢 PIX
                        </label>

                    </div>

                </div>


                <hr>


                <h5>
                    🧾 Resumo
                </h5>

                <div id="resumo-checkout"></div>


                <div class="d-flex justify-content-between fs-5 mt-3">

                    <strong>Total:</strong>

                    <strong id="total-checkout">
                        R$ 0,00
                    </strong>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Voltar
                </button>


                <button
                    type="button"
                    class="btn btn-success"
                    onclick="finalizarPedido()"
                >
                    ✅ Confirmar pedido
                </button>

            </div>

        </div>

    </div>

</div>
</body>
</html>
